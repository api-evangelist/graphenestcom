name: graphenest.com
description: >-
  Graphenest is a Portuguese nano-cleantech company that develops sustainable,
  high-performance graphene-based materials for electromagnetic interference
  (EMI/EMC/RF) shielding. Its proprietary, scalable and low-energy graphene
  production process powers two industrial-ready product lines: HexaShield, a
  sprayable conductive coating for high-frequency applications, and G-Shield, a
  family of conductive thermoplastics for extrusion and injection moulding, plus
  the G-Prime graphene material. The solutions deliver higher shielding
  performance at lower cost and weight (up to 75% lighter than metal
  alternatives) for Tier 1/Tier 2 manufacturers in batteries, electronics,
  telecom (radar, LiDAR, 5G/6G), and cables & wires. Graphenest is a materials
  and manufacturing company; it publishes no public developer API, SDK, or
  developer portal. This profile was surfaced as a Techstars-linked portfolio
  lead and enriched from the company's public website.
